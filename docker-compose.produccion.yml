# Ambiente de despliegue de SIMA: PostgreSQL + Django (gunicorn) + Caddy con HTTPS.
#   1. Copiar despliegue/produccion.env.example como despliegue/produccion.env y completar las claves.
#   2. docker compose -f docker-compose.produccion.yml --env-file despliegue/produccion.env up -d --build
#   3. Abrir https://localhost (o el dominio configurado).
# Detalle en docs/despliegue.md.
name: sima-produccion

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sima
      POSTGRES_USER: sima
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes:
      - datos_produccion:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sima -d sima"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sima:${POSTGRES_PASSWORD}@db:5432/sima
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?falta DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${SIMA_DOMINIO:-localhost},backend
      CSRF_TRUSTED_ORIGINS: https://${SIMA_DOMINIO:-localhost}
      CORS_ALLOWED_ORIGINS: https://${SIMA_DOMINIO:-localhost}
      SIMA_CARGAR_DEMO: ${SIMA_CARGAR_DEMO:-0}
      SIMA_MANTENEDOR_NOMBRE: ${SIMA_MANTENEDOR_NOMBRE:-Ascensores Altavía}
      SIMA_MANTENEDOR_INSCRIPCION: ${SIMA_MANTENEDOR_INSCRIPCION:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      SIMA_DOMINIO: ${SIMA_DOMINIO:-localhost}
    ports:
      - "${SIMA_PUERTO_HTTP:-80}:80"
      - "${SIMA_PUERTO_HTTPS:-443}:443"
    volumes:
      - certificados:/data
    depends_on:
      - backend

volumes:
  datos_produccion:
  certificados:
